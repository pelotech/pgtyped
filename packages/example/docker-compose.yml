version: '3.9'

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - ./sql/:/docker-entrypoint-initdb.d

  build: &build
    build:
      # Root context: the image installs the whole workspace, so it needs every
      # package manifest, not just the example's.
      context: ../..
      dockerfile: packages/example/Dockerfile
      args:
        NODE_IMAGE: 'node:${NODE_VERSION:-24}-alpine'
    environment:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: password
      CI: $CI
    volumes:
      - ../../:/app
      # Anonymous volumes: keep the image's node_modules from being shadowed by
      # the host's, whose native binaries are built for the wrong platform.
      # pnpm does not hoist, so each package has its own link farm to preserve
      # alongside the root store.
      - /app/node_modules
      - /app/packages/cli/node_modules
      - /app/packages/example/node_modules
      - /app/packages/runtime/node_modules
    working_dir: /app/packages/example
    deploy:
      restart_policy:
        condition: none
    depends_on:
      - db
    command: sh -c "node /app/packages/cli/lib/index.js --config config.json && ./check-git-diff.sh"

  watch:
    <<: *build
    # Invoked through node, like the build service: the CLI's lib/ is built on
    # the host and bind-mounted in, so the image has no .bin/pgtyped to run.
    command: node /app/packages/cli/lib/index.js --watch --config config.json

  test:
    <<: *build
    depends_on:
      - build
    command: npx vitest run index.test.ts
