name: CI

on:
  push:
    branches:
      - main
  # No base-branch filter: stacked PRs target their parent branch, not main,
  # and would otherwise get no checks at all.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every leg: a single failing version used to cancel its siblings,
      # which hid whether the others were healthy.
      fail-fast: false
      matrix:
        node-version: ['24', '26']
    name: Test (node ${{ matrix.node-version }}.x)
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Typecheck test files (packages with check:test)
        run: pnpm -r --if-present run check:test
      - name: Run tests
        run: pnpm test
        env:
          NODE_VERSION: ${{ matrix.node-version }}
