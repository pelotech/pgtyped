name: CI

on:
  push:
    branches:
      - master
  # No base-branch filter: stacked PRs target their parent branch, not master,
  # and would otherwise get no checks at all.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every leg: a single failing version used to cancel its siblings,
      # which hid whether the others were healthy.
      fail-fast: false
      matrix:
        node-version: ['24', '26']
    name: Test (node ${{ matrix.node-version }}.x)
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - name: Build packages
        run: npm run build
      - name: Typecheck tests
        run: npm run check:test --workspaces --if-present
      - name: Run tests
        run: npm test
        env:
          NODE_VERSION: ${{ matrix.node-version }}
