name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Maintain the release PR
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please takes a grouped pull request's version from a root
      # package — a candidate whose path is "." — and this repository has none,
      # only packages/cli and packages/runtime. A ${version} token in
      # group-pull-request-title-pattern therefore resolves to nothing, and the
      # title falls back to "chore: release <branch>". Squash-merging then lands
      # a commit on the default branch that does not say what was released, so
      # read the version the pull request itself proposes and put it in the title.
      - name: Put the released version in the pull request title
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          number=$(jq -r '.number' <<<"$PR")
          head=$(jq -r '.headBranchName' <<<"$PR")
          version=$(gh api "repos/${{ github.repository }}/contents/.release-please-manifest.json?ref=$head" \
            --jq '.content' | base64 -d | jq -r '."packages/cli"')
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "No version in .release-please-manifest.json on $head" >&2
            exit 1
          fi
          gh pr edit "$number" --title "chore: release $version"

  publish:
    name: Publish to GitHub Packages
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@pelotech'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # release-please has already bumped and committed the versions, so this
      # publishes whatever is not yet on the registry. `pnpm publish -r` skips
      # private packages (the example) and rewrites the `workspace:*` sibling
      # ranges to the real version as it packs. --no-git-checks because the
      # release commit is what we are publishing from.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm publish -r --no-git-checks
